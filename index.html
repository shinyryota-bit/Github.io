<style>

:root{

--background:#050816;

--panel:#0d1325;

--panel2:#111b33;

--border:#19325e;

--text:#eef8ff;

--muted:#86b3d7;

--accent:#3bb8ff;

--accent2:#2b7cff;

--success:#2ecc71;

--danger:#ff4f6d;

--shadow:0 0 25px rgba(30,130,255,.20);

}

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:"Cairo",sans-serif;

}

html{

height:100%;

scroll-behavior:smooth;

}

body{

height:100%;

overflow:hidden;

background:var(--background);

color:var(--text);

}

button,input,textarea{

font-family:inherit;

}

button{

cursor:pointer;

}

#matrix{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

overflow:hidden;

z-index:-2;

background:
radial-gradient(circle at center,
#071120,
#03050a);

}

.matrixLine{

position:absolute;

width:2px;

background:
linear-gradient(
transparent,
#22b5ff,
transparent);

opacity:.35;

animation:
matrixMove linear infinite;

}

@keyframes matrixMove{

0%{

transform:
translateY(110vh);

}

100%{

transform:
translateY(-150vh);

}

}

#app{

width:100vw;

height:100vh;

display:flex;

flex-direction:column;

backdrop-filter:blur(4px);

}

header{

height:70px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

border-bottom:1px solid var(--border);

background:
rgba(6,10,20,.75);

}

.logo{

display:flex;

align-items:center;

gap:12px;

font-size:22px;

font-weight:700;

}

.logoCircle{

width:42px;

height:42px;

border-radius:50%;

background:
linear-gradient(
135deg,
#28c7ff,
#1f64ff);

display:flex;

align-items:center;

justify-content:center;

box-shadow:var(--shadow);

}

.headerButtons{

display:flex;

gap:10px;

}

.headerButtons button{

background:var(--panel2);

border:1px solid var(--border);

color:white;

padding:10px 18px;

border-radius:10px;

transition:.25s;

}

.headerButtons button:hover{

background:#18315d;

}

main{

flex:1;

display:flex;

overflow:hidden;

}

aside{

width:290px;

background:rgba(10,17,33,.88);

border-left:1px solid var(--border);

display:flex;

flex-direction:column;

}

.sidebarTitle{

padding:18px;

font-size:18px;

font-weight:700;

border-bottom:1px solid var(--border);

}

.memoryList{

flex:1;

overflow:auto;

padding:12px;

}

.memoryCard{

padding:14px;

margin-bottom:12px;

border-radius:12px;

background:var(--panel);

border:1px solid var(--border);

transition:.25s;

}

.memoryCard:hover{

transform:translateY(-2px);

border-color:var(--accent);

}

.chatArea{

flex:1;

display:flex;

flex-direction:column;

overflow:hidden;

}

#messages{

flex:1;

overflow:auto;

padding:25px;

display:flex;

flex-direction:column;

gap:18px;

}

.message{

max-width:82%;

padding:18px;

border-radius:18px;

line-height:1.9;

word-break:break-word;

white-space:pre-wrap;

}

.ai{

align-self:flex-start;

background:#111b31;

border:1px solid #224a7b;

}

.user{

align-self:flex-end;

background:#1179dd;

}

.chatInputContainer{

padding:18px;

border-top:1px solid var(--border);

background:rgba(8,13,25,.92);

}

#uploadPreview{

display:none;

gap:10px;

overflow-x:auto;

margin-bottom:12px;

padding-bottom:4px;

}

.previewItem{

min-width:80px;

height:80px;

border-radius:12px;

overflow:hidden;

border:1px solid var(--border);

background:var(--panel);

display:flex;

align-items:center;

justify-content:center;

position:relative;

}

.previewItem img{

width:100%;

height:100%;

object-fit:cover;

}

.previewItem span{

font-size:11px;

padding:6px;

text-align:center;

}

.removePreview{

position:absolute;

top:4px;

left:4px;

width:22px;

height:22px;

border-radius:50%;

background:#ff3d57;

border:none;

color:white;

font-size:13px;

}

.inputRow{

display:flex;

gap:12px;

align-items:flex-end;

}

.toolButtons{

display:flex;

flex-direction:column;

gap:10px;

}

.toolButtons button{

width:50px;

height:50px;

border-radius:14px;

border:1px solid var(--border);

background:var(--panel2);

color:white;

font-size:20px;

transition:.25s;

}

.toolButtons button:hover{

background:#1a3565;

transform:translateY(-2px);

}

#prompt{

flex:1;

min-height:60px;

max-height:260px;

resize:none;

padding:16px;

border-radius:16px;

background:#0f1930;

border:1px solid var(--border);

color:white;

font-size:16px;

outline:none;

overflow:auto;

}

#prompt:focus{

border-color:var(--accent);

box-shadow:0 0 18px rgba(55,170,255,.25);

}

#sendBtn{

width:85px;

height:60px;

border:none;

border-radius:16px;

background:

linear-gradient(

135deg,

#31b7ff,

#2366ff);

color:white;

font-size:18px;

font-weight:bold;

box-shadow:var(--shadow);

transition:.25s;

}

#sendBtn:hover{

transform:translateY(-2px);

}

.typing{

display:none;

align-items:center;

gap:8px;

margin:0 25px 18px;

color:#9fcfff;

font-size:14px;

}

.typing div{

width:8px;

height:8px;

border-radius:50%;

background:#35b8ff;

animation:bounce 1s infinite;

}

.typing div:nth-child(2){

animation-delay:.2s;

}

.typing div:nth-child(3){

animation-delay:.4s;

}

@keyframes bounce{

0%,80%,100%{

transform:scale(.4);

opacity:.4;

}

40%{

transform:scale(1);

opacity:1;

}

}

::-webkit-scrollbar{

width:8px;

height:8px;

}

::-webkit-scrollbar-thumb{

background:#24528b;

border-radius:20px;

}

::-webkit-scrollbar-track{

background:transparent;

}

.dragOverlay{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

display:none;

align-items:center;

justify-content:center;

background:rgba(0,0,0,.65);

backdrop-filter:blur(6px);

z-index:999;

font-size:34px;

font-weight:bold;

color:white;

border:3px dashed #38b8ff;

}

.dragOverlay.show{

display:flex;

}

.hidden{

display:none;

}

@media(max-width:900px){

aside{

display:none;

}

.message{

max-width:95%;

}

header{

padding:0 12px;

}

.logo{

font-size:18px;

}

.toolButtons{

}

.toolButtons button{

width:46px;

height:46px;

}

#sendBtn{

}

}

@media(max-width:500px){

header{

height:60px;

}

#messages{

padding:15px;

}

#prompt{

font-size:15px;

}

</style>

<script>

/*==================================================

Version 0.1

const matrix =
document.getElementById("matrix");

const messages =
document.getElementById("messages");

const prompt =
document.getElementById("prompt");

const sendBtn =
document.getElementById("sendBtn");

const typing =
document.getElementById("typing");

const imageInput =
document.getElementById("imageInput");

const fileInput =
document.getElementById("fileInput");

const imageBtn =
document.getElementById("imageBtn");

const fileBtn =
document.getElementById("fileBtn");

const preview =
document.getElementById("uploadPreview");

const dragOverlay =
document.getElementById("dragOverlay");

let uploadedFiles=[];

let uploadedImages=[];


/*=========================
الخلفية المتحركة
=========================*/

for(let i=0;i<170;i++){

const line=document.createElement("div");

line.className="matrixLine";

line.style.left=
Math.random()*100+"vw";

line.style.height=
(60+Math.random()*320)+"px";

line.style.animationDuration=
(4+Math.random()*9)+"s";

line.style.animationDelay=
(-Math.random()*12)+"s";

matrix.appendChild(line);

/*=========================
تكبير مربع الكتابة
=========================*/

function resizePrompt(){

prompt.style.height="60px";

prompt.style.height=
prompt.scrollHeight+"px";

}

prompt.addEventListener(

"input",

resizePrompt

);


/*=========================
النزول لآخر رسالة
=========================*/

function scrollBottom(){

messages.scrollTop=
messages.scrollHeight;

}


/*=========================
إضافة رسالة
=========================*/

function addMessage(

type,

text

){

const div=
document.createElement("div");

div.className=
"message "+type;

div.textContent=text;

messages.appendChild(div);

scrollBottom();

}


/*=========================
إظهار الكتابة
=========================*/

function showTyping(){

typing.style.display="flex";

scrollBottom();

}

function hideTyping(){

typing.style.display="none";

}


/*=========================
إرسال رسالة
=========================*/

function sendMessage(){

const text=
prompt.value.trim();

if(

text==="" &&

uploadedFiles.length===0 &&

uploadedImages.length===0

){

return;

}

addMessage(

"user",

text

);

prompt.value="";

resizePrompt();

preview.innerHTML="";

preview.style.display="none";

uploadedFiles=[];

uploadedImages=[];

showTyping();


/*

لاحقاً هنا سيتم:

1- حفظ الرسالة في Supabase.

2- إرسالها إلى الذكاء الاصطناعي.

3- استقبال الرد.

*/

setTimeout(()=>{

hideTyping();

addMessage(

"ai",

"تم استلام الرسالة. سيتم لاحقًا إرسالها إلى الذكاء الاصطناعي."

);

},900);

}

sendBtn.addEventListener(

"click",

sendMessage

);

prompt.addEventListener(

"keydown",

e=>{

if(

e.key==="Enter"

&&

!e.shiftKey

){

e.preventDefault();

sendMessage();

}

});


/*=========================
زر الصورة
=========================*/

imageBtn.onclick=()=>{

imageInput.click();

};


/*=========================
زر الملفات
=========================*/

fileBtn.onclick=()=>{

fileInput.click();

};

/*==================================================
رفع الصور والملفات
==================================================*/

function refreshPreview(){

preview.innerHTML="";

if(
uploadedImages.length===0 &&
uploadedFiles.length===0
){

preview.style.display="none";

return;

}

preview.style.display="flex";


uploadedImages.forEach((file,index)=>{

const reader=new FileReader();

reader.onload=e=>{

const card=document.createElement("div");

card.className="previewItem";

card.innerHTML=`

<img src="${e.target.result}">

<button class="removePreview">

✕

</button>

`;

card.querySelector("button")

.onclick=()=>{

uploadedImages.splice(index,1);

refreshPreview();

};

preview.appendChild(card);

};

reader.readAsDataURL(file);

});


uploadedFiles.forEach((file,index)=>{

const card=document.createElement("div");

card.className="previewItem";

card.innerHTML=`

<span>

📄

<br><br>

${file.name}

</span>

<button class="removePreview">

✕

</button>

`;

card.querySelector("button")

.onclick=()=>{

uploadedFiles.splice(index,1);

refreshPreview();

};

preview.appendChild(card);

});

scrollBottom();

}


/*=========================
اختيار الصور
=========================*/

imageInput.addEventListener(

"change",

()=>{

for(const file of imageInput.files){

uploadedImages.push(file);

}

refreshPreview();

imageInput.value="";

}

);


/*=========================
اختيار الملفات
=========================*/

fileInput.addEventListener(

"change",

()=>{

for(const file of fileInput.files){

uploadedFiles.push(file);

}

refreshPreview();

fileInput.value="";

}

);


/*=========================
السحب والإفلات
=========================*/

window.addEventListener(

"dragenter",

e=>{

e.preventDefault();

dragOverlay.classList.add("show");

}

);

window.addEventListener(

"dragover",

e=>{

e.preventDefault();

}

);

window.addEventListener(

"dragleave",

e=>{

if(

e.target===document.documentElement ||

e.target===document.body

){

dragOverlay.classList.remove("show");

}

}

);

window.addEventListener(

"drop",

e=>{

e.preventDefault();

dragOverlay.classList.remove("show");

const files=

[...e.dataTransfer.files];

for(const file of files){

if(

file.type.startsWith("image/")

){

uploadedImages.push(file);

}else{

uploadedFiles.push(file);

}

}

refreshPreview();

});


/*=========================
إظهار الحجم
=========================*/

function formatSize(bytes){

if(bytes<1024)

return bytes+" B";

if(bytes<1024*1024)

return (bytes/1024).toFixed(1)+" KB";

if(bytes<1024*1024*1024)

return (bytes/1024/1024).toFixed(2)+" MB";

return (bytes/1024/1024/1024).toFixed(2)+" GB";

}


/*=========================
إشعار مؤقت
=========================*/

function toast(text){

const div=document.createElement("div");

div.style.position="fixed";

div.style.bottom="30px";

div.style.left="50%";

div.style.transform="translateX(-50%)";

div.style.background="#0e1a33";

div.style.border="1px solid #2c70ff";

div.style.padding="14px 22px";

div.style.borderRadius="12px";

div.style.zIndex="99999";

div.style.boxShadow="0 0 20px rgba(40,140,255,.25)";

div.textContent=text;

document.body.appendChild(div);

setTimeout(()=>{

div.remove();

},2500);

}


toast("واجهة AI Brain جاهزة.");

تحميل مكتبة Supabase

حفظ رسالة

=========================*/

role,

content

){

if(!supabase)

return;


const {error}=

await supabase

.from("messages")

.insert({

content,

created_at:

/*=========================

حفظ ذاكرة

async function saveMemory(

title,

content

){

return;


const {error}=

await supabase

.from("brain")

title,

/*=========================

قراءة الذكريات

=========================*/

async function loadMemory(){


if(!supabase)

return;


const {data,error}=

await supabase

.from("brain")

.select("*")

.order(

"id",

{

ascending:false

}

);


if(error){

console.error(error);

return;

}


const list=

document.getElementById(

"memoryList"

);


list.innerHTML="";


if(

!data ||

data.length===0

){

list.innerHTML=

`

<div class="memoryCard">

لا توجد بيانات.

</div>

`;

return;

}


for(const item of data){

const card=

document.createElement(

"div"

);

card.className=

"memoryCard";

card.innerHTML=

`

<b>${item.title}</b>

<br><br>

${item.content}

`;

list.appendChild(card);

}


}

حفظ المحادثة

=========================*/

addMessage;


addMessage=function(

type,

/*=========================

تشغيل

let AI_ENDPOINT="";

إعداد الاتصال

function configureAI({

endpoint,

key,

model

}){

AI_ENDPOINT=endpoint;

AI_KEY=key;

/*============================

المحادثة الحالية

============================*/

let conversation=[];



function clearConversation(){

conversation=[];

}



function addConversation(

role,

content

){

conversation.push({

role,

content

});

}



/*============================

إضافة الذكريات للمحادثة

============================*/

async function collectMemory(){


if(!supabase)

return "";


try{

const {data}=

await supabase

.from("brain")

.select("*")

.order(

"id",

{

ascending:false

})

.limit(30);


if(!data)

return "";


let text="";


for(const item of data){

text+=

`# ${item.title}

${item.content}

`;

}


return text;


}catch{

return "";

}


}



/*============================

إرسال الطلب

============================*/

async function askAI(

message

){

showTyping();

addConversation(

"user",

message

);


const memory=

await collectMemory();


const body={

model:MODEL_NAME,

memory,

conversation,

message

};


/*

لن نستخدمها الآن.

سيتم تغييرها لاحقاً

حسب Gemini أو OpenAI.

*/

try{


const response=

await fetch(

AI_ENDPOINT,

{

method:"POST",

headers:{

"Content-Type":"application/json",

"Authorization":

"Bearer "+AI_KEY

},

body:

JSON.stringify(body)

}

);


const result=

await response.json();


let answer="";


/*

سنعدل هذا لاحقاً

بحسب شكل استجابة الـAI.

*/

answer=

result.answer ||

result.response ||

result.text ||

"لم يصل رد.";


addConversation(

"assistant",

answer

);


hideTyping();


addMessage(

"ai",

answer

);


}catch(error){

hideTyping();

console.error(error);

addMessage(

"ai",

"حدث خطأ أثناء الاتصال بالذكاء الاصطناعي."

);

}

}

sendMessage;

/*==========================
فهرسة ملف
==========================*/

AIBrain.indexer.indexFile=function(file){

if(!file)return;

if(!file.content)return;

const info={

name:file.name,

size:file.size,

lines:file.content.split("\n").length,

functions:[],

classes:[],

ids:[],

imports:[]

};

const lines=file.content.split("\n");

for(let i=0;i<lines.length;i++){

const line=lines[i].trim();



if(

line.startsWith("function ")

){

const name=

line

.replace("function ","")

.split("(")[0]

.trim();

info.functions.push({

name,

line:i+1

});

}



if(

line.includes("=>")

&&

line.includes("=")

){

const left=

line.split("=")[0].trim();

info.functions.push({

name:left,

line:i+1

});

}



if(

line.startsWith("class ")

){

const name=

line

.replace("class ","")

.split("{")[0]

.trim();

info.classes.push({

name,

line:i+1

});

}



const idMatch=

line.match(

/id=["']([^"']+)["']/

);

if(idMatch){

info.ids.push({

id:idMatch[1],

line:i+1

});

}



if(

line.startsWith("import ")

){

info.imports.push({

text:line,

line:i+1

});

}

}

this.files[file.name]=info;

};

فهرسة المشروع بالكامل

function(){

){

/*==================================================
Code Intelligence
Version 1.0
==================================================*/

AIBrain.intelligence={

graph:{},

dependencies:{},

references:{},

warnings:[]

};


/*=============================
تحليل ملف
=============================*/

AIBrain.intelligence.scanFile=function(file){

if(!file)return;

if(!file.content)return;

const lines=file.content.split("\n");

const result={

name:file.name,

calls:[],

imports:[],

exports:[],

elements:[]

};

for(let i=0;i<lines.length;i++){

const line=lines[i].trim();



/* import */

if(line.startsWith("import ")){

result.imports.push({

line:i+1,

text:line

});

}



/* export */

if(line.startsWith("export ")){

result.exports.push({

line:i+1,

text:line

});

}



/* document.getElementById */

const ids=

line.match(

/getElementById\(["'](.+?)["']\)/

);

if(ids){

result.elements.push({

id:ids[1],

line:i+1

});

}



/* function calls */

const matches=

line.matchAll(

/([a-zA-Z0-9_]+)\(/g

);

for(const m of matches){

const name=m[1];

if(

name!="if" &&

name!="for" &&

name!="while" &&

name!="switch" &&

name!="catch"

){

result.calls.push({

name,

line:i+1

});

}

}

}

this.graph[file.name]=result;

};



/*=============================
تحليل المشروع
=============================*/

AIBrain.intelligence.scan=function(){

this.graph={};

for(const file of AIBrain.project.files){

this.scanFile(file);

}

};



/*=============================
البحث عن استدعاء دالة
=============================*/

AIBrain.intelligence.findCalls=function(name){

const result=[];

for(const file in this.graph){

for(const call of this.graph[file].calls){

if(call.name===name){

result.push({

file,

line:call.line

});

}

}

}

return result;

};



/*=============================
معرفة الملفات التي تستخدم ID
=============================*/

AIBrain.intelligence.findElement=function(id){

const result=[];

for(const file in this.graph){

for(const el of this.graph[file].elements){

if(el.id===id){

result.push({

file,

line:el.line

});

}

}

}

return result;

};



/*=============================
فحص مبدئي
=============================*/

AIBrain.intelligence.check=function(){

this.warnings=[];

for(const file in this.graph){

const data=this.graph[file];

if(data.calls.length===0){

this.warnings.push({

type:"info",

file,

message:"لا توجد دوال مستدعاة."

});

}

if(data.elements.length>100){

this.warnings.push({

type:"warning",

file,

message:"عدد كبير من عناصر DOM."

});

}

}

return this.warnings;

};

اختيار أفضل الذكريات
============================*/

AIBrain.memoryEngine.best=function(){

return this.items

.sort((a,b)=>{

const sa=

a.importance+

a.uses;

const sb=

b.importance+

b.uses;

return sb-sa;

})

.slice(

0,

this.maxContext

);

};

بناء Context
============================*/

AIBrain.memoryEngine.buildContext=

function(){

const best=

this.best();

let context="";

for(

const item

of best

){

context+=

`

[${item.type}]

${item.title}

${item.content}

`;

}

return context;

};

/*==================================================
Session Manager
Version 1.0
==================================================*/

AIBrain.session={

current:null,

sessions:[]

};


/*============================
إنشاء جلسة
============================*/

AIBrain.session.create=function(title){

const session={

id:crypto.randomUUID(),

title:title||"محادثة جديدة",

createdAt:Date.now(),

updatedAt:Date.now(),

messages:[],

files:[],

memory:[]

};

this.sessions.push(session);

this.current=session.id;

return session;

};


/*============================
الجلسة الحالية
============================*/

AIBrain.session.get=function(){

return this.sessions.find(

s=>s.id===this.current

);

};


/*============================
إضافة رسالة
============================*/

AIBrain.session.addMessage=function(

role,

content

){

const session=this.get();

if(!session)return;

session.messages.push({

role,

content,

time:Date.now()

});

session.updatedAt=Date.now();

};


/*============================
إضافة ملف
============================*/

AIBrain.session.addFile=function(file){

const session=this.get();

if(!session)return;

session.files.push(file);

session.updatedAt=Date.now();

};


/*============================
إضافة ذاكرة
============================*/

AIBrain.session.addMemory=function(memory){

const session=this.get();

if(!session)return;

session.memory.push(memory);

session.updatedAt=Date.now();

};


/*============================
تبديل الجلسة
============================*/

AIBrain.session.open=function(id){

const found=this.sessions.find(

s=>s.id===id

);

if(found){

this.current=id;

return true;

}

return false;

};


/*============================
حذف جلسة
============================*/

AIBrain.session.remove=function(id){

this.sessions=

this.sessions.filter(

s=>s.id!==id

);

if(this.current===id){

this.current=

this.sessions[0]?.id||null;

}

};


/*============================
آخر جلسة
============================*/

AIBrain.session.last=function(){

return this.sessions

.sort(

(a,b)=>b.updatedAt-a.updatedAt

)[0];

};


/*============================
إحصائيات
============================*/

AIBrain.session.stats=function(){

return{

sessions:this.sessions.length,

current:this.current

};

};


/*============================
تشغيل
============================*/

if(

AIBrain.session.sessions.length===0

){

AIBrain.session.create(

"الجلسة الأولى"

);

}

console.log(

"Session Manager Ready"

);

/*==================================================
Context Builder
Version 1.0
==================================================*/

AIBrain.context={

maxCharacters:80000,

cache:""

};



/*==========================
آخر الرسائل
==========================*/

AIBrain.context.lastMessages=function(limit=10){

const session=

AIBrain.session.get();

if(!session)

return [];

return session.messages.slice(-limit);

};



/*==========================
آخر التعديلات
==========================*/

AIBrain.context.lastChanges=function(limit=15){

return AIBrain.changelog.entries

.slice(-limit);

};



/*==========================
أفضل الذكريات
==========================*/

AIBrain.context.bestMemory=function(){

return AIBrain.memoryEngine

.best();

};



/*==========================
بناء Context
==========================*/

AIBrain.context.build=function(){

let text="";

/* قواعد المشروع */

text+="### PROJECT RULES ###\n";

for(

const rule

of AIBrain.brain.rules

){

text+=

rule.text+"\n";

}


/* الذكريات */

text+="\n### MEMORY ###\n";

for(

const memory

of this.bestMemory()

){

text+=

memory.title+"\n";

text+=

memory.content+"\n\n";

}


/* آخر التعديلات */

text+="### CHANGES ###\n";

for(

const change

of this.lastChanges()

){

text+=

change.file+

" : "+

change.description+

"\n";

}


/* آخر المحادثة */

text+="\n### CHAT ###\n";

for(

const msg

of this.lastMessages()

){

text+=

msg.role+

": "+

msg.content+

"\n";

}


/* المشروع */

text+="\n### PROJECT ###\n";

for(

const file

of AIBrain.project.list()

){

text+=

file.name+

" ("+

file.size+

")\n";

}


/* قص الزائد */

if(

text.length>

this.maxCharacters

){

text=

text.slice(

text.length-

this.maxCharacters

);

}

this.cache=text;

return text;

};



/*==========================
السياق النهائي
==========================*/

AIBrain.context.export=function(){

return this.cache||

this.build();

};



console.log(

"Context Builder Ready"

);

/*==================================================
AI Request Engine
Version 1.0
==================================================*/

AIBrain.request={

busy:false,

lastResponse:null,

lastError:null,

lastTime:0,

retry:2

};


/*============================
إنشاء الطلب
============================*/

AIBrain.request.create=function(message){

return{

model:AIBrain.ai.currentModel,

message,

context:AIBrain.context.build(),

session:AIBrain.session.current,

time:Date.now()

};

};


/*============================
إرسال الطلب
============================*/

AIBrain.request.send=async function(message){

if(this.busy){

throw new Error(

"يوجد طلب قيد التنفيذ."

);

}

this.busy=true;

this.lastError=null;

const payload=

this.create(message);

const start=

performance.now();

try{

const reply=

await AIBrain.ai.send(

payload

);

this.lastTime=

Math.round(

performance.now()-start

);

this.lastResponse=reply;

AIBrain.session.addMessage(

"user",

message

);

AIBrain.session.addMessage(

"assistant",

reply

);

AIBrain.changelog.add({

file:"AI",

action:"chat",

target:"conversation",

description:

"تم تنفيذ طلب ذكاء اصطناعي."

});

return reply;

}catch(error){

this.lastError=error;

throw error;

}finally{

this.busy=false;

}

};


/*============================
إعادة المحاولة
============================*/

AIBrain.request.retrySend=

async function(message){

for(

let i=0;

i<=this.retry;

i++

){

try{

return await

this.send(message);

}catch(e){

if(

i===this.retry

){

throw e;

}

}

}

};


/*============================
آخر نتيجة
============================*/

AIBrain.request.info=function(){

return{

busy:this.busy,

time:this.lastTime,

error:this.lastError,

response:this.lastResponse

};

};


/*============================
إلغاء

(نسخة أولية)

============================*/

AIBrain.request.cancel=function(){

this.busy=false;

};



console.log(

"AI Request Engine Ready"

);

/*==================================================
Core Integration Engine
Version 1.0
==================================================*/

AIBrain.core={

version:"1.0",

ready:false,

started:false

};


/*============================
فحص النظام
============================*/

AIBrain.core.check=function(){

const result={

supabase:!!supabase,

session:!!AIBrain.session.get(),

project:true,

brain:true,

memory:true,

context:true,

request:true

};

return result;

};



/*============================
بدء التشغيل
============================*/

AIBrain.core.start=async function(){

if(this.started)

return;

this.started=true;



const state=

this.check();



console.table(state);



this.ready=true;



toast(

"AIBrain Started"

);

};



/*============================
استقبال رسالة
============================*/

AIBrain.core.chat=

async function(message){



if(!this.ready){

await this.start();

}



if(

message.trim()===""

)return;



AIBrain.session

.addMessage(

"user",

message

);



AIBrain.memoryEngine

.add({

type:"message",

title:"User",

content:message,

importance:6,

tags:["chat"]

});



const reply=

await AIBrain.request

.retrySend(

message

);



AIBrain.session

.addMessage(

"assistant",

reply

);



AIBrain.memoryEngine

.add({

type:"reply",

title:"Assistant",

content:reply,

importance:5,

tags:["reply"]

});



return reply;

};

رفع مشروع
============================*/

AIBrain.core.loadProject=

async function(files){



await

AIBrain.project

.addFiles(files);



AIBrain.indexer

.scan();



AIBrain.intelligence

.scan();



AIBrain.sync

.project();



AIBrain.changelog

.add({

file:"Project",

action:"scan",

description:

"تم تحليل المشروع بالكامل."

});



return

AIBrain.project

.stats();

};



/*============================
إعادة تحميل

============================*/

AIBrain.core.reload=

function(){

AIBrain.indexer.scan();

AIBrain.intelligence.scan();

};



/*============================
ملخص كامل

============================*/

AIBrain.core.summary=

function(){

session:

AIBrain.session.stats(),

AIBrain.brain.summary(),

AIBrain.storage.stats(),

AIBrain.request.info(),

"Core Integration Ready"

AIBrain.core.start();

/*==================================================
Repository Manager
Version 1.0
==================================================*/

AIBrain.repository={

files:new Map(),

openedFile:null,

projectName:"",

projectVersion:"1.0.0",

lastUpdate:null

};


/*============================
إضافة ملف
============================*/

AIBrain.repository.add=function(file){

this.files.set(

file.name,

file

);

this.lastUpdate=Date.now();

};


/*============================
إضافة عدة ملفات
============================*/

AIBrain.repository.addMany=function(files){

for(const file of files){

this.add(file);

}

};


/*============================
فتح ملف
============================*/

AIBrain.repository.open=function(name){

if(!this.files.has(name))

return null;

this.openedFile=name;

return this.files.get(name);

};


/*============================
الملف الحالي
============================*/

AIBrain.repository.current=function(){

if(!this.openedFile)

return null;

return this.files.get(

this.openedFile

);

};


/*============================
حذف
============================*/

AIBrain.repository.remove=function(name){

this.files.delete(name);

};


/*============================
قائمة الملفات
============================*/

AIBrain.repository.list=function(){

return [...this.files.keys()];

};


/*============================
بحث
============================*/

AIBrain.repository.search=function(keyword){

keyword=

keyword.toLowerCase();

const result=[];

for(

const file

of this.files.values()

){

if(

file.name

.toLowerCase()

.includes(keyword)

){

result.push(file);

continue;

}

if(

file.content &&

file.content

.toLowerCase()

.includes(keyword)

){

result.push(file);

}

}

return result;

};


/*============================
إحصائيات
============================*/

AIBrain.repository.stats=

function(){

let chars=0;

let size=0;

for(

const file

of this.files.values()

){

size+=file.size||0;

chars+=

file.content?

file.content.length:0;

}

return{

files:this.files.size,

characters:chars,

bytes:size,

opened:this.openedFile

};

};


/*============================
تفريغ
============================*/

AIBrain.repository.clear=

function(){

this.files.clear();

this.openedFile=null;

};


console.log(

"Repository Manager Ready"

);

/*==================================================
AI Task Manager
Version 1.0
==================================================*/

AIBrain.tasks={

queue:[],

running:false,

history:[],

current:null

};


/*============================
إضافة مهمة
============================*/

AIBrain.tasks.add=function({

type,

title,

data

}){

const task={

id:crypto.randomUUID(),

type,

title,

data,

status:"waiting",

createdAt:Date.now(),

startedAt:null,

finishedAt:null

};

this.queue.push(task);

return task.id;

};



/*============================
الحصول على المهمة
============================*/

AIBrain.tasks.next=function(){

return this.queue.find(

t=>t.status==="waiting"

);

};



/*============================
تشغيل مهمة
============================*/

AIBrain.tasks.run=

async function(){

if(this.running)

return;

const task=

this.next();

if(!task)

return;

this.running=true;

this.current=task.id;

task.status="running";

task.startedAt=Date.now();

try{

switch(task.type){

case"chat":

await AIBrain.core.chat(

task.data.message

);

break;

case"scan":

AIBrain.core.reload();

break;

case"context":

AIBrain.context.build();

break;

case"sync":

AIBrain.sync.project();

break;

default:

console.warn(

"Unknown Task"

);

}

task.status="done";

}catch(e){

console.error(e);

task.status="failed";

task.error=e.message;

}

task.finishedAt=Date.now();

this.history.push(task);

this.running=false;

this.current=null;

};



/*============================
تشغيل الجميع
============================*/

AIBrain.tasks.runAll=

async function(){

while(

this.next()

){

await this.run();

}

};



/*============================
حذف المنتهية
============================*/

AIBrain.tasks.clearFinished=

function(){

this.queue=

this.queue.filter(

t=>t.status!=="done"

);

};



/*============================
الإحصائيات
============================*/

AIBrain.tasks.stats=

function(){

return{

waiting:

this.queue.filter(

t=>t.status==="waiting"

).length,

running:this.running,

history:

this.history.length

};

};



console.log(

"Task Manager Ready"

);

/*==================================================
Permission Manager
Version 1.0
==================================================*/

AIBrain.permissions={

roles:{},

currentRole:"owner",

logs:[]

};


/*============================
إنشاء دور
============================*/

AIBrain.permissions.createRole=function(

name,

permissions=[]

){

this.roles[name]={

name,

permissions

};

};



/*============================
إضافة صلاحية
============================*/

AIBrain.permissions.add=function(

role,

permission

){

if(!this.roles[role])

return;

if(

!this.roles[role]

.permissions.includes(permission)

){

this.roles[role]

.permissions.push(permission);

}

};



/*============================
حذف صلاحية
============================*/

AIBrain.permissions.remove=function(

role,

permission

){

if(!this.roles[role])

return;

this.roles[role]

.permissions=

this.roles[role]

.permissions.filter(

p=>p!==permission

);

};



/*============================
تغيير الدور الحالي
============================*/

AIBrain.permissions.use=function(

role

){

if(

this.roles[role]

){

this.currentRole=role;

}

};



/*============================
فحص الصلاحية
============================*/

AIBrain.permissions.can=function(

permission

){

const role=

this.roles[

this.currentRole

];

if(!role)

return false;

return role

.permissions

.includes(permission);

};



/*============================
تنفيذ أداة
============================*/

AIBrain.permissions.run=

async function(

permission,

callback

){

if(

!this.can(permission)

){

this.logs.push({

permission,

success:false,

time:Date.now()

});

throw new Error(

"Permission denied."

);

}

this.logs.push({

permission,

success:true,

time:Date.now()

});

return await callback();

};



/*============================
السجل
============================*/

AIBrain.permissions.history=

function(){

return this.logs;

};



/*============================
تهيئة الأدوار
============================*/
